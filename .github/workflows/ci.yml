name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Require canonical SMALL progress and code/docs co-changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | ./scripts/check-small-sync.sh
          git diff --name-only "$BASE_SHA" HEAD | bash ./scripts/check-docs-sync.sh
      - name: Verify documentation contract and source-bound bundle
        run: |
          go test ./cmd/loopexec -run '^TestDocumentationContract' -count=1
          go test ./tools/docs-continuity -count=1
          go run ./tools/docs-continuity bundle "$RUNNER_TEMP/loopexec-documentation"
      - name: Format
        run: test -z "$(gofmt -l cmd internal examples tools)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race checks
        run: go test -race ./internal/...
      - name: Scoped budget race checks
        run: go test -race ./cmd/loopexec -run TestScopedBudget -count=3
      - name: Build proof binaries
        run: |
          go build -o "$RUNNER_TEMP/loopexec" ./cmd/loopexec
          go build -o "$RUNNER_TEMP/creative-workflow" ./examples/creative-workflow
      - name: Legacy proof
        run: ./scripts/dogfood-proof.sh "$RUNNER_TEMP/loopexec" .artifacts/dogfood
      - name: Creative proof
        run: ./scripts/creative-proof.sh "$RUNNER_TEMP/loopexec" "$RUNNER_TEMP/creative-workflow" .artifacts/creative
      - name: Scoped budget offline proof
        run: ./scripts/scoped-budget-proof.sh "$RUNNER_TEMP/loopexec" .artifacts/scoped-budget
      - name: Fetch pinned SMALL release
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/small"
          cd "$RUNNER_TEMP/small"
          archive="small-v1.1.2-$(go env GOOS)-$(go env GOARCH).tar.gz"
          base="https://github.com/justyn-clark/small-protocol/releases/download/v1.1.2"
          curl --fail --location --retry 2 "$base/checksums.txt" -o checksums.txt
          curl --fail --location --retry 2 "$base/$archive" -o "$archive"
          awk -v archive="$archive" '$2 == archive {print}' checksums.txt > selected.txt
          test -s selected.txt
          shasum -a 256 -c selected.txt
          tar -xzf "$archive"
          ./small version
      - name: Validate canonical SMALL state
        run: |
          "$RUNNER_TEMP/small/small" check --strict
      - name: SMALL v1 and collaborative v2 compatibility
        run: ./scripts/small-proof.sh "$RUNNER_TEMP/loopexec" "$RUNNER_TEMP/small/small" .artifacts/small
      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loopexec-proof-${{ runner.os }}-${{ github.run_id }}
          path: |
            .artifacts
            !.artifacts/**/private/**
            !.artifacts/**/diagnostics/**
            !.artifacts/**/.small-cache/**
          if-no-files-found: error
          include-hidden-files: true
