name: CI

on:
  push:
  pull_request:

jobs:
  go-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Go version
        run: go version

      - name: Format check (gofmt)
        run: |
          files=$(find . -type f -name '*.go' -not -path './vendor/*')
          out=$(gofmt -l $files)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build dogfood binary
        run: go build -o "$RUNNER_TEMP/loopexec" ./cmd/loopexec

      - name: Dogfood execution-integrity contract
        run: ./scripts/dogfood-proof.sh "$RUNNER_TEMP/loopexec" .artifacts/dogfood

      - name: Upload dogfood receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loopexec-dogfood-${{ github.run_id }}
          path: .artifacts/dogfood
          if-no-files-found: error
